<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/">
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #080909;
      }

      #root {
        min-height: 100vh;
      }

      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #080909;
      }

      #app-boot-loader-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 4px solid rgba(247, 247, 247, 0.25);
        border-top-color: #d50000;
        border-radius: 9999px;
        animation: app-boot-spin 800ms linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot-loader-spinner {
          animation: none;
        }
      }
    </style>
    <title>CineSphere - venha curtir essa experiência</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app-boot-loader" role="status" aria-label="Carregando CineSphere">
      <div id="app-boot-loader-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
